<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAESTRO Layout e Navegação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script>
(function () {
  var t = 'default', m = 'light';
  try {
    t = localStorage.getItem('maestro-theme') || t;
    m = localStorage.getItem('maestro-mode') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch (e) { /* sem armazenamento */ }
  document.documentElement.setAttribute('data-theme', t);
  document.documentElement.setAttribute('data-mode', m);
})();
</script>
<style>
:root, [data-theme="default"][data-mode="light"] {
  /* Layout: barra lateral fixa + barra superior + faixa de aviso + conteúdo. Estilo do MUI. */
  /* Tema padrão, modo claro. Os outros temas e o modo escuro só trocam estas variáveis. */
  --primary: #1565c0;
  --primary-dark: #0d47a1;
  --primary-tint: #e3f0fc;
  --accent: #1565c0;
  --on-tint: #0d47a1;
  --on-primary: #ffffff;
  --appbar-bg: #1565c0;
  --texture: none;
  --bg: #f4f6f9;
  --surface: #ffffff;
  --text: #1c2430;
  --muted: #5b6675;
  --border: #e2e6ec;
  --border-strong: #c9d0da;
  --border-hover: #8b97a8;
  --outline-border: #9bbfe6;
  --row-hover: #f7f9fc;
  --row-strong: #fafbfc;
  --flash: #cfe3fa;
  --mark: #ffe9a8;
  --ok: #2e7d32;
  --ok-bg: #e8f5e9;
  --warn: #8a5300;
  --warn-bg: #fff1d6;
  --warn-border: #f0d9a8;
  --notice-btn: #8a5300;
  --notice-btn-hover: #6d4100;
  --info: #0b66b8;
  --info-bg: #e3f2fd;
  --neutral-bg: #eceff3;
  --danger: #c62828;
  --danger-border: #e3a9a9;
  --danger-bg: #fdecec;
  --snack: #323232;
  --r-card: 12px;
  --r-ctl: 8px;
  --r-btn: 8px;
  --font: 'Roboto', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  color-scheme: light;
}
/* Tema padrão: forma, fonte e textura (vale também para a prévia dentro de outro tema) */
[data-theme="default"] {
  --texture: none; --r-card: 12px; --r-ctl: 8px; --r-btn: 8px;
  --font: 'Roboto', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
/* Tema padrão, modo escuro */
[data-theme="default"][data-mode="dark"] {
  --primary: #1f6fc9; --primary-dark: #3d8be0; --primary-tint: #1d3552; --accent: #7db8f5; --on-tint: #d3e8ff;
  --appbar-bg: #16365f;
  --bg: #11161d; --surface: #1a212b; --text: #e6ebf2; --muted: #9ba7b8; --border: #2b3441; --border-strong: #3c4757; --border-hover: #6b7b90;
  --outline-border: #3f628f; --row-hover: #212a36; --row-strong: #1f2732; --flash: #24456e; --mark: #6b5a1d;
  --ok: #81c784; --ok-bg: #1e3a22; --warn: #ffcc80; --warn-bg: #3d2e12; --warn-border: #5a4420; --notice-btn: #a35f00; --notice-btn-hover: #864e00;
  --info: #90caf9; --info-bg: #14304a; --neutral-bg: #28313e; --danger: #ff8a80; --danger-border: #7a3b38; --danger-bg: #3a1f1f; --snack: #3a4350;
  color-scheme: dark;
}
/* Tema Fofo, modo claro: rosa suave, cantos arredondados e textura no topo */
[data-theme="fofo"] {
  --primary: #c2386f; --primary-dark: #a12c59; --primary-tint: #ffe3ee; --accent: #b02f61; --on-tint: #861f49;
  --appbar-bg: #c43f76;
  --texture: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%2764%27%20height=%2764%27%20viewBox=%270%200%2064%2064%27%20fill=%27white%27%20fill-opacity=%27.2%27%3E%3Cpath%20transform=%27translate%284%204%29%20scale%281.1%29%27%20d=%27M10%2017C4%2012%203%208%206%206c2-1%204%200%204%202%200-2%202-3%204-2%203%202%202%206-4%2011z%27/%3E%3Cpath%20transform=%27translate%2836%2034%29%20scale%28.9%29%27%20d=%27M10%2017C4%2012%203%208%206%206c2-1%204%200%204%202%200-2%202-3%204-2%203%202%202%206-4%2011z%27/%3E%3Ccircle%20cx=%2740%27%20cy=%2712%27%20r=%272.2%27/%3E%3Ccircle%20cx=%2712%27%20cy=%2746%27%20r=%272.2%27/%3E%3Ccircle%20cx=%2756%27%20cy=%2756%27%20r=%271.6%27/%3E%3Ccircle%20cx=%2726%27%20cy=%2728%27%20r=%271.4%27/%3E%3C/svg%3E");
  --bg: #fff6f9; --surface: #ffffff; --text: #3d2b35; --muted: #7a6470; --border: #f3d6e2; --border-strong: #e5bccd; --border-hover: #c98fa8;
  --outline-border: #eaa7c1; --row-hover: #fff0f5; --row-strong: #fff8fb; --flash: #ffd2e3; --mark: #ffe0f0;
  --ok: #2a7549; --ok-bg: #e4f6ec; --warn: #8a5300; --warn-bg: #fff1d6; --warn-border: #f0d9a8; --notice-btn: #8a5300; --notice-btn-hover: #6d4100;
  --info: #7a3fa8; --info-bg: #f1e5fa; --neutral-bg: #f8e9f0; --danger: #c62828; --danger-border: #e3a9a9; --danger-bg: #fdecec; --snack: #5a3a4b;
  --r-card: 20px; --r-ctl: 14px; --r-btn: 999px;
  --font: 'Nunito', 'Roboto', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
/* Tema Fofo, modo escuro */
[data-theme="fofo"][data-mode="dark"] {
  --primary: #c2386f; --primary-dark: #d85a8c; --primary-tint: #4a2a3d; --accent: #ff9cc0; --on-tint: #ffd6e6;
  --appbar-bg: #8a2c55;
  --bg: #1c141b; --surface: #271b26; --text: #f7e9f1; --muted: #c9aebd; --border: #43303f; --border-strong: #5a4156; --border-hover: #8f6a84;
  --outline-border: #8a4a68; --row-hover: #30222f; --row-strong: #2d202c; --flash: #5a2d45; --mark: #6b3556;
  --ok: #8fd6a9; --ok-bg: #1d3a2a; --warn: #ffcc80; --warn-bg: #3d2e12; --warn-border: #5a4420; --notice-btn: #a35f00; --notice-btn-hover: #864e00;
  --info: #d9b3f5; --info-bg: #35224a; --neutral-bg: #32232f; --danger: #ff8a80; --danger-border: #7a3b38; --danger-bg: #3a1f1f; --snack: #4a3446;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--font); font-size: 14px; line-height: 1.5; background: var(--bg); color: var(--text); }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hidden { display: none !important; }

/* Estrutura */
.app { display: flex; height: 100%; }
.sidebar { width: 260px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
.brand { height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 20px; font-weight: 700; font-size: 18px; color: var(--accent); border-bottom: 1px solid var(--border); }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-size: 14px; }
.nav { padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.nav-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 40px; padding: 6px 12px; border: 0; border-radius: var(--r-ctl); background: transparent; cursor: pointer; text-align: left; color: var(--text); }
.nav-row:hover { background: var(--neutral-bg); }
.nav-row.active { background: var(--primary-tint); color: var(--on-tint); font-weight: 500; }
.nav-row svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; color: var(--muted); }
.nav-row.active svg { color: var(--accent); }
.nav-row .label { flex: 1; }
.chev { transition: transform .15s; }
.group.open .chev { transform: rotate(180deg); }
.sub { display: none; flex-direction: column; gap: 2px; padding: 2px 0 6px; }
.group.open .sub { display: flex; }
.sub .nav-row { padding-left: 44px; min-height: 36px; }
.sidebar-foot { margin-top: auto; position: sticky; bottom: 0; background: var(--surface); padding: 12px 20px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.appbar { height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; background-color: var(--appbar-bg); background-image: var(--texture); background-size: 64px 64px; color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); position: relative; z-index: 2; }
.icon-btn { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; color: inherit; cursor: pointer; display: none; place-items: center; }
.icon-btn:hover { background: rgba(255,255,255,.15); }
.icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.crumbs { font-size: 15px; display: flex; gap: 8px; align-items: center; min-width: 0; }
.crumbs .sep { opacity: .6; }
.crumbs .group-name { opacity: .8; }
.crumbs .page-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.user { display: flex; align-items: center; gap: 8px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: #fff; color: var(--appbar-bg); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.btn-text { border: 0; background: transparent; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; }
.btn-text:hover { background: rgba(255,255,255,.15); }

.notice { flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 24px; background: var(--warn-bg); color: var(--warn); border-bottom: 1px solid var(--warn-border); }
.notice strong { font-weight: 500; }
.notice .btn { margin-left: auto; }

.content { flex: 1; overflow: auto; padding: 24px; }
.page { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.page-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 24px; font-weight: 500; text-wrap: balance; }
.page-head .sub-title { color: var(--muted); width: 100%; margin-top: -8px; }
.page-head .spacer { flex: 1; }

/* Botões */
.btn { border: 1px solid transparent; border-radius: var(--r-btn); padding: 7px 16px; font-weight: 500; cursor: pointer; background: var(--primary); color: var(--on-primary); text-transform: uppercase; letter-spacing: .03em; font-size: 13px; }
.btn:hover { background: var(--primary-dark); }
.btn.outlined { background: transparent; color: var(--accent); border-color: var(--outline-border); }
.btn.outlined:hover { background: var(--primary-tint); }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger-border); }
.btn.danger:hover { background: var(--danger-bg); }
.btn.small { padding: 4px 10px; font-size: 12px; }
.notice .btn { background: var(--notice-btn); color: #fff; }
.notice .btn:hover { background: var(--notice-btn-hover); }

/* Cartões e tabelas */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; padding: 16px; align-items: center; border-bottom: 1px solid var(--border); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 160px; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .field select { height: 38px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: var(--r-ctl); background: var(--surface); min-width: 0; }
.field input:hover, .field select:hover { border-color: var(--border-hover); }
.field input:focus, .field select:focus { border-color: var(--accent); outline: 1px solid var(--accent); }
.grow { flex: 1; min-width: 200px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; background: #fafbfc; }
td { padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th.num, td.num { text-align: right; }
tbody tr.clickable { cursor: pointer; }
tbody tr:hover { background: var(--row-hover); }
.pager { display: flex; justify-content: flex-end; gap: 16px; padding: 12px 16px; color: var(--muted); border-top: 1px solid var(--border); font-size: 13px; }
.empty { padding: 32px; text-align: center; color: var(--muted); }

.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--neutral-bg); color: var(--muted); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.info { background: var(--info-bg); color: var(--info); }

/* Formulários e painéis */
.grid { display: grid; gap: 16px; }
.cols-2 { grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); }
.pad { padding: 16px; }
.pad h2 { margin: 0 0 12px; font-size: 16px; font-weight: 500; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
.summary { display: flex; flex-direction: column; gap: 8px; }
.summary .row { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.summary .row.total { border-top: 1px solid var(--border); padding-top: 8px; font-weight: 700; font-size: 16px; }
.summary .hint { color: var(--muted); font-size: 12px; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.check { display: flex; align-items: center; gap: 8px; }
.alert { padding: 12px 16px; border-radius: var(--r-ctl); background: var(--info-bg); color: var(--info); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
.kv .k { font-size: 12px; color: var(--muted); }
.kv .v { font-weight: 500; }
tr.sub-total td, tr.result td { font-weight: 700; background: var(--row-strong); }
td.neg { color: var(--muted); }
.flag { color: var(--warn); font-weight: 500; }

/* Vendas: tela do rascunho */
.muted { color: var(--muted); }
.sr { position: absolute; left: -9999px; }
.split { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(340px, 1fr); gap: 16px; align-items: start; }
.plist-filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.plist-filters .grow { flex: 1 1 100%; }
.plist-filters .field:not(.grow):not(.narrow) { flex: 1 1 140px; }
.field.narrow-date { min-width: 128px; width: 140px; }
.field.narrow { min-width: 92px; width: 104px; flex: 1 1 92px; }
.form-grid.compact .field { min-width: 0; }
#ed-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; position: sticky; bottom: -24px; z-index: 1; background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -4px 10px rgba(0, 0, 0, .06); border-radius: 0 0 12px 12px; }
.bar-total { display: flex; flex-direction: column; line-height: 1.25; }
.bar-total span { font-size: 12px; color: var(--muted); }
.bar-total strong { font-size: 18px; font-variant-numeric: tabular-nums; }
.bar-btns { display: flex; gap: 12px; margin-left: auto; }
.plist-items { list-style: none; margin: 12px 0 0; padding: 0; max-height: min(58vh, 560px); overflow: auto; border: 1px solid var(--border); border-radius: var(--r-ctl); }
.pitem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; align-items: center; }
.pitem:last-child { border-bottom: 0; }
.pitem:hover, .pitem.hi { background: var(--primary-tint); }
.pitem.disabled { opacity: .55; cursor: not-allowed; }
.pname { font-weight: 500; }
.pcat { grid-column: 1; grid-row: 2; color: var(--muted); font-size: 12px; }
.pprice { grid-column: 2; grid-row: 1; text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.pstock { grid-column: 2; grid-row: 2; text-align: right; color: var(--muted); font-size: 12px; }
.pstock.low { color: var(--warn); font-weight: 500; }
.pitem.flash { animation: flash .65s; }
@keyframes flash { from { background: var(--flash); } to { background: transparent; } }
mark { background: var(--mark); color: inherit; padding: 0; }
.order-head { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
.lines-title { padding: 12px 16px 0; font-weight: 500; }
.line { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.line.swapping { background: var(--warn-bg); }
.line-main { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.line-name { font-weight: 500; }
.line-comps { font-size: 12px; color: var(--muted); }
.line-ctl { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.mat-wrap { margin: 12px 16px; border: 1px solid var(--border-strong); border-radius: var(--r-ctl); background: var(--surface); }
.mat-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: var(--r-ctl); background: transparent; cursor: pointer; text-align: left; font: inherit; }
.mat-head:hover { background: var(--primary-tint); }
.mat-head .mat-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.mat-head .mat-title { font-weight: 500; display: flex; align-items: center; gap: 8px; }
.mat-head .badge { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 10px; background: var(--neutral-bg); color: var(--muted); }
.mat-head .badge.on { background: var(--primary-tint); color: var(--accent); }
.mat-head .mat-sum { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mat-head .mat-act { color: var(--accent); font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
.mat-head .chev { width: 8px; height: 8px; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(45deg); margin: 0 4px 3px 0; transition: transform .15s; }
.mat-head[aria-expanded="true"] .chev { transform: rotate(-135deg); margin-top: 5px; }
.mat-body { padding: 0 12px 12px; }
.mat-list { max-height: 220px; overflow: auto; margin-top: 8px; border: 1px solid var(--border); border-radius: var(--r-ctl); padding: 4px; }
.mat-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 4px 10px; border-radius: var(--r-ctl); cursor: pointer; user-select: none; }
.mat-row:hover { background: var(--neutral-bg); }
.mat-row.on { background: var(--primary-tint); }
.mat-row .check input { width: 20px; height: 20px; accent-color: var(--primary); pointer-events: none; margin: 0; }
.mat-row .check { gap: 12px; }
.mat-row .qty { background: var(--surface); cursor: default; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: var(--r-ctl); }
.qty button { width: 32px; height: 32px; border: 0; background: transparent; cursor: pointer; font-size: 18px; border-radius: var(--r-ctl); }
.qty button:hover { background: var(--neutral-bg); }
.qty span { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
.price-in { width: 96px; height: 32px; padding: 0 8px; border: 1px solid var(--border-strong); border-radius: var(--r-ctl); background: var(--surface); }
.line-sub { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
.x { border: 0; background: transparent; cursor: pointer; font-size: 18px; color: var(--muted); width: 32px; height: 32px; border-radius: 50%; }
.x:hover { background: var(--neutral-bg); color: var(--danger); }
.link { border: 0; background: transparent; color: var(--accent); cursor: pointer; padding: 0; font-weight: 500; }
.link:hover { text-decoration: underline; }
.form-grid.compact { grid-template-columns: 1fr 1fr; border-top: 1px solid var(--border); }
.err { color: var(--danger); font-size: 12px; min-height: 0; }
.field.error input, .field.error select { border-color: var(--danger); }
.start { max-width: 520px; display: flex; flex-direction: column; gap: 12px; }
.start h2 { margin: 0; }
.start p { margin: 0; }
.comps-row { padding-top: 0; font-size: 12px; white-space: normal; }
.modal-scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: grid; place-items: center; padding: 16px; z-index: 40; }
.modal { background: var(--surface); border-radius: var(--r-card); max-width: 560px; width: 100%; max-height: 92%; display: flex; flex-direction: column; box-shadow: 0 12px 32px rgba(0, 0, 0, .3); }

  function moneyVal(el) { var d = el.value.replace(/\D/g, ''); return d ? parseInt(d, 10) / 100 : NaN; }
  function maskMoney(el) {
    var d = el.value.replace(/\D/g, '').replace(/^0+/, '');
    if (!d) { el.value = ''; return; }
    while (d.length < 3) d = '0' + d;
    el.value = d.slice(0, -2).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + d.slice(-2);
  }
  document.addEventListener('input', function (e) { if (e.target.hasAttribute && e.target.hasAttribute('data-money')) maskMoney(e.target); }, true);
  var moneyFocus = false;
  document.addEventListener('focusin', function (e) { if (e.target.hasAttribute && e.target.hasAttribute('data-money')) { var t = e.target; moneyFocus = true; setTimeout(function () { t.select(); }, 0); } });
  document.addEventListener('mouseup', function (e) { if (moneyFocus && e.target.hasAttribute && e.target.hasAttribute('data-money')) e.preventDefault(); moneyFocus = false; }, true);
  document.addEventListener('focusout', function (e) { var t = e.target; if (t.getAttribute && t.getAttribute('data-money') === 'zero' && !t.value) t.value = fmtMoney(0); });
  /* Lista suspensa própria: troca o select nativo e mantém o select como fonte do valor */
  function enhanceSelect(sel) {
    if (sel.getAttribute('data-dd')) return;
    sel.setAttribute('data-dd', '1');
    var wrap = document.createElement('div'); wrap.className = 'dd';
    sel.parentNode.insertBefore(wrap, sel); wrap.appendChild(sel);
    sel.classList.add('dd-native'); sel.tabIndex = -1; sel.setAttribute('aria-hidden', 'true');
    var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'dd-btn';
    btn.setAttribute('aria-haspopup', 'listbox'); btn.setAttribute('aria-expanded', 'false');
    var lab = sel.id ? document.querySelector('label[for="' + sel.id + '"]') : null;
    if (lab) { if (!lab.id) lab.id = sel.id + '-lbl'; btn.setAttribute('aria-labelledby', lab.id); }
    wrap.appendChild(btn);
    var list = null, hi = 0;
    function paint() {
      var o = sel.options[sel.selectedIndex];
      btn.innerHTML = '<span class="dd-text">' + esc(o ? o.text : '') + '</span><span class="dd-chev"></span>';
    }
    function close() {
      if (!list) return;
      list.remove(); list = null; btn.setAttribute('aria-expanded', 'false');
      document.removeEventListener('mousedown', outside, true); window.removeEventListener('resize', close);
      document.removeEventListener('scroll', onScroll, true);
    }
    function onScroll(e) { if (list && !list.contains(e.target)) close(); }
    function outside(e) { if (list && !list.contains(e.target) && !wrap.contains(e.target)) close(); }
    function draw() {
      list.innerHTML = Array.prototype.map.call(sel.options, function (o, i) {
        return '<li class="dd-opt' + (i === hi ? ' hi' : '') + '" role="option" id="' + (sel.id || 'dd') + '-o' + i + '" data-i="' + i + '" aria-selected="' + (i === sel.selectedIndex) + '">' + esc(o.text) + '</li>';
      }).join('');
      btn.setAttribute('aria-activedescendant', (sel.id || 'dd') + '-o' + hi);
    }
    function place() {
      var r = btn.getBoundingClientRect(), h = Math.min(264, list.scrollHeight), below = innerHeight - r.bottom, above = r.top;
      list.style.minWidth = r.width + 'px'; list.style.left = Math.min(r.left, innerWidth - r.width - 8) + 'px';
      if (below < h + 12 && above > below) { list.style.top = 'auto'; list.style.bottom = (innerHeight - r.top + 4) + 'px'; list.style.maxHeight = Math.min(264, above - 12) + 'px'; }
      else { list.style.bottom = 'auto'; list.style.top = (r.bottom + 4) + 'px'; list.style.maxHeight = Math.min(264, below - 12) + 'px'; }
    }
    function open() {
      if (list) return;
      hi = Math.max(0, sel.selectedIndex);
      list = document.createElement('ul'); list.className = 'dd-list'; list.setAttribute('role', 'listbox');
      document.body.appendChild(list); draw(); place();
      btn.setAttribute('aria-expanded', 'true');
      var cur = list.querySelector('.hi'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
      list.addEventListener('mousedown', function (e) { e.preventDefault(); });
      list.addEventListener('click', function (e) { var li = e.target.closest('[data-i]'); if (li) pick(+li.getAttribute('data-i')); });
      list.addEventListener('mousemove', function (e) { var li = e.target.closest('[data-i]'); if (li && +li.getAttribute('data-i') !== hi) { hi = +li.getAttribute('data-i'); draw(); } });
      document.addEventListener('mousedown', outside, true); window.addEventListener('resize', close);
      document.addEventListener('scroll', onScroll, true);
    }
    function pick(i) {
      var changed = i !== sel.selectedIndex;
      sel.selectedIndex = i; paint(); close(); btn.focus();
      if (changed) { sel.dispatchEvent(new Event('input', { bubbles: true })); sel.dispatchEvent(new Event('change', { bubbles: true })); }
    }
    btn.addEventListener('click', function () { if (list) close(); else open(); });
    btn.addEventListener('keydown', function (e) {
      var n = sel.options.length;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!list) { open(); return; }
        hi = e.key === 'ArrowDown' ? Math.min(hi + 1, n - 1) : Math.max(hi - 1, 0); draw();
        var c = list.querySelector('.hi'); if (c && c.scrollIntoView) c.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (list) pick(hi); else open();
      } else if (e.key === 'Escape' && list) { e.stopPropagation(); close(); }
      else if (e.key === 'Tab') close();
      else if (e.key.length === 1 && /\S/.test(e.key)) {
        var k = norm(e.key);
        for (var j = 1; j <= n; j++) {
          var idx = ((list ? hi : sel.selectedIndex) + j) % n;
          if (norm(sel.options[idx].text).indexOf(k) === 0) { if (list) { hi = idx; draw(); } else pick(idx); break; }
        }
      }
    });
    sel.addEventListener('focus', function () { btn.focus(); });
    paint();
  }
  function enhanceAll(root) {
    (root.matches && root.matches('select') ? [root] : []).concat(Array.prototype.slice.call(root.querySelectorAll ? root.querySelectorAll('select') : [])).forEach(enhanceSelect);
  }
  new MutationObserver(function (muts) {
    muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) enhanceAll(n); }); });
  }).observe(document.body, { childList: true, subtree: true });
  enhanceAll(document.body);

  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function norm(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function hl(name, q) {
    if (!q) return name;
    var n = norm(name), nq = norm(q), i = n.indexOf(nq);
    if (i < 0) return name;
    return name.slice(0, i) + '<mark>' + name.slice(i, i + nq.length) + '</mark>' + name.slice(i + nq.length);
  }
  function optionsHtml(list, selected) {
    return list.map(function (o) { return '<option' + (o === selected ? ' selected' : '') + '>' + o + '</option>'; }).join('');
  }

  /* Diálogos */
  function openModal(html, wide) {
    lastFocus = document.activeElement;
    $('modal-root').innerHTML = '<div class="modal-scrim"><div class="modal' + (wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' + html + '</div></div>';
  }
  function closeModal() {
    $('modal-root').innerHTML = '';
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) { /* sem foco */ } }
  }
  function dialog(title, body, actions) {
    openModal('<div class="modal-head"><h2>' + title + '</h2></div><div class="modal-body">' + body + '</div><div class="modal-foot">' +
      actions.map(function (a, i) { return '<button class="btn ' + (a.cls || '') + '" type="button" data-dlg="' + i + '">' + a.label + '</button>'; }).join('') + '</div>');
    $('modal-root').querySelectorAll('[data-dlg]').forEach(function (b) {
      b.addEventListener('click', function () {
        var a = actions[+b.getAttribute('data-dlg')];
        if (a.fn && a.fn() === false) return;
        closeModal();
      });
    });
    var last = $('modal-root').querySelectorAll('[data-dlg]');
    if (last.length) last[last.length - 1].focus();
  }

  /* Lista de produtos com busca (usada no pedido e na montagem do kit) */
  function plistHtml(id, kinds, withNew) {
    var cats = [];
    products.forEach(function (p) { if (kinds.indexOf(p.kind) > -1 && p.cat && cats.indexOf(p.cat) === -1) cats.push(p.cat); });
    return '<div class="plist-filters">' +
      '<div class="field grow"><label for="' + id + '-q">Buscar produto</label>' + (withNew ? '<div class="search-row">' : '') + '<input id="' + id + '-q" type="search" autocomplete="off" placeholder="Digite qualquer parte do nome" role="combobox" aria-expanded="true" aria-controls="' + id + '-list">' + (withNew ? '<button class="btn outlined" type="button" id="' + id + '-new">Novo produto</button></div>' : '') + '</div>' +
      '<div class="field"><label for="' + id + '-cat">Categoria</label><select id="' + id + '-cat"><option value="">Todas</option>' + optionsHtml(cats) + '</select></div>' +
      '<div class="field narrow"><label for="' + id + '-min">Preço de</label><input id="' + id + '-min" type="text" data-money inputmode="numeric" autocomplete="off"></div>' +
      '<div class="field narrow"><label for="' + id + '-max">Preço até</label><input id="' + id + '-max" type="text" data-money inputmode="numeric" autocomplete="off"></div></div>' +
      '<ul class="plist-items" id="' + id + '-list" role="listbox" aria-label="Produtos"></ul>';
  }
  function plistBind(id, getCanal, kinds, needPrice, onPick, onNew) {
    var hi = 0, shown = [];
    function matches() {
      var q = norm($(id + '-q').value.trim()), cat = $(id + '-cat').value;
      var mn = moneyVal($(id + '-min')), mx = moneyVal($(id + '-max')), ch = getCanal();
      return products.filter(function (p) {
        if (kinds.indexOf(p.kind) === -1) return false;
        if (q && norm(p.name).indexOf(q) === -1) return false;
        if (cat && p.cat !== cat) return false;
        var pr = p.price ? p.price[ch] : undefined;
        if (!isNaN(mn) && (pr === undefined || pr < mn)) return false;
        if (!isNaN(mx) && (pr === undefined || pr > mx)) return false;
        return true;
      });
    }
    function render() {
      shown = matches();
      if (hi >= shown.length) hi = Math.max(0, shown.length - 1);
      var q = $(id + '-q').value.trim(), ch = getCanal();
      $(id + '-list').innerHTML = shown.length ? shown.map(function (p, i) {
        var pr = p.price ? p.price[ch] : undefined;
        var blocked = needPrice && pr === undefined;
        var right = p.kind === 'kit' ? '<span class="pstock">Kit · montar</span>' : '<span class="pstock' + (p.stock <= 10 ? ' low' : '') + '">Saldo ' + p.stock + '</span>';
        return '<li class="pitem' + (i === hi ? ' hi' : '') + (blocked ? ' disabled' : '') + '" role="option" aria-selected="' + (i === hi) + '" data-pid="' + p.id + '">' +
          '<span class="pname">' + hl(p.name, q) + '</span><span class="pcat">' + (p.cat || '—') + '</span>' +
          '<span class="pprice">' + (pr !== undefined ? money(pr) : (needPrice ? 'Sem preço no canal' : '—')) + '</span>' + right + '</li>';
      }).join('') : '<li class="empty">Nenhum produto encontrado.' + (onNew && q ? '<br><button class="btn outlined small" type="button" data-newtxt="1">Cadastrar produto "' + esc(q) + '"</button>' : '') + '</li>';
    }
    function scrollHi() { var el = $(id + '-list').querySelector('.hi'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' }); }
    function pick(p) {
      var ch = getCanal();
      if (needPrice && (!p.price || p.price[ch] === undefined)) { snack(p.name + ' não tem preço no canal ' + ch + '.'); return; }
      onPick(p);
      var li = $(id + '-list').querySelector('[data-pid="' + p.id + '"]');
      if (li) { li.classList.add('flash'); setTimeout(function () { li.classList.remove('flash'); }, 650); }
    }
    $(id + '-q').addEventListener('input', function () { hi = 0; render(); });
    ['cat', 'min', 'max'].forEach(function (k) { $(id + '-' + k).addEventListener('input', function () { hi = 0; render(); }); });
    $(id + '-q').addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); hi = Math.min(hi + 1, shown.length - 1); render(); scrollHi(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); hi = Math.max(hi - 1, 0); render(); scrollHi(); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        if (shown[hi]) pick(shown[hi]);
        else if (onNew && $(id + '-q').value.trim()) onNew($(id + '-q').value.trim());
      }
    });
    if (onNew) $(id + '-new').addEventListener('click', function () { onNew($(id + '-q').value.trim()); });
    $(id + '-list').addEventListener('click', function (e) {
      if (onNew && e.target.closest('[data-newtxt]')) { onNew($(id + '-q').value.trim()); return; }
      var li = e.target.closest('[data-pid]');
      if (!li) return;
      var p = byId(+li.getAttribute('data-pid'));
      hi = shown.indexOf(p);
      pick(p);
    });
    render();
    return { refresh: render };
  }

  function renderEditor() {

      (d.id ? '<button class="btn danger small" type="button" id="ed-del">Excluir rascunho</button>' : '') + '</div>' +

      '<div class="card order">' +
      '<div class="pad order-head"><div class="field grow"><label for="ed-ch">Canal</label><select id="ed-ch">' + optionsHtml(Object.keys(channels), d.ch) + '</select></div>' +
      '<button class="btn outlined small" type="button" id="ed-recalc">Recalcular preços</button></div>' +
      '<div id="ed-lines"></div><div class="pad summary" id="ed-totals"></div>' +
      '<div class="pad form-grid compact">' +
      '<div class="field" id="ed-cust-field"><label for="ed-cust">Cliente</label><div class="cust-row"><div class="combo"><input id="ed-cust" type="search" autocomplete="off" placeholder="Obrigatório para efetivar" role="combobox" aria-expanded="false" aria-controls="ed-cust-list" value="' + esc(d.cust) + '"><ul class="combo-list hidden" id="ed-cust-list" role="listbox" aria-label="Clientes"></ul></div><button class="btn outlined" type="button" id="ed-newcust">Novo cliente</button></div><span class="err" id="ed-cust-err"></span></div>' +
      '<div class="field"><label for="ed-fr">Frete cobrado (R$)</label><input id="ed-fr" type="text" data-money="zero" inputmode="numeric" autocomplete="off" placeholder="0,00" value="' + fmtMoney(d.freight) + '"></div>' +

    }, function (text) { openNewProduct(text, list); });

  /* Sair da tela do rascunho: qualquer navegação (botão, menu, voltar do navegador) pergunta antes de descartar alterações */
  var suppressRoute = false;
  function leaveDraft() { go('sales'); }
  function draftNeedsGuard() {
    var d = draft;

  }
  function guardLeave(target) {
    if (!draftNeedsGuard()) return false;

      [{ label: 'Continuar editando', cls: 'outlined' },
       { label: 'Sair sem salvar', cls: 'danger', fn: function () { draft = null; go(target); } },
       { label: 'Salvar e sair', fn: function () { if (d.id) saveExisting(); else saveNew(); draft = null; go(target); } }]);
    return true;
  }

  /* Materiais: seção recolhível, com busca e uma caixa de marcação por material */
  var matOpen = false, matQ = '';
  function renderMats() {
    var d = draft, box = $('ed-mats'), q = norm(matQ.trim());
    var sum = d.mats.length ? d.mats.map(function (m) { return byId(m.pid).name + ' ×' + m.q; }).join(' · ') : 'Nenhum material';
    var n = d.mats.length;
    var h = '<div class="mat-wrap"><button class="mat-head" type="button" data-act="mtoggle" aria-expanded="' + matOpen + '"><span class="mat-info"><span class="mat-title">Materiais <span class="badge' + (n ? ' on' : '') + '">' + (n ? n + (n === 1 ? ' material' : ' materiais') : 'nenhum') + '</span></span>' +
      (n ? '<span class="mat-sum">' + sum + '</span>' : '') + '</span><span class="mat-act">' + (matOpen ? 'Recolher' : (n ? 'Editar' : 'Adicionar')) + '</span><span class="chev"></span></button>';
    if (matOpen) {
      var list = products.filter(function (p) { return p.kind === 'material' && (!q || norm(p.name).indexOf(q) > -1); });
      h += '<div class="mat-body"><div class="field"><label for="ed-mat-q">Buscar material</label><input id="ed-mat-q" type="search" autocomplete="off" placeholder="Digite qualquer parte do nome" value="' + esc(matQ) + '"></div><div class="mat-list">' +
        (list.length ? list.map(function (p) {

            (idx > -1 ? '<div class="qty"><button type="button" data-act="mdec" data-i="' + idx + '" aria-label="Diminuir a quantidade de ' + p.name + '">−</button><span>' + d.mats[idx].q + '</span>' +
            '<button type="button" data-act="minc" data-i="' + idx + '" aria-label="Aumentar a quantidade de ' + p.name + '">+</button></div>' : '') + '</div>';
        }).join('') : '<div class="empty">Nenhum material encontrado.</div>') + '</div></div>';

  function matsChanged() { markDirty(); renderMats(); renderTotals(); renderActions(); }
  function renderTotals() {
    var d = draft, t = calc(d), ch = channels[d.ch];
    $('ed-totals').innerHTML =
      '<div class="row"><span>Valor da venda</span><span>' + money(t.value) + '</span></div>' +
      '<div class="row"><span>Custo estimado</span><span>' + money(t.cost) + '</span></div>' +

  function renderActions() {

  function addItem(p) {
    var d = draft, found = null;
    d.items.forEach(function (it) { if (it.pid === p.id && !it.comps) found = it; });
    if (found) found.q += 1; else d.items.push({ pid: p.id, q: 1, pr: p.price[d.ch] });
    markDirty(); renderLines();
  }
  function setMat(pid, on) {
    var d = draft, has = d.mats.some(function (m) { return m.pid === pid; });
    if (on && !has) d.mats.push({ pid: pid, q: 1 });
    else if (!on && has) d.mats = d.mats.filter(function (m) { return m.pid !== pid; });
    else return;
    matsChanged();
  }
  function onLinesClick(e) {
    var row = e.target.closest('[data-matrow]');
    if (row && !e.target.closest('.qty')) {
      var rpid = +row.getAttribute('data-matrow');
      setMat(rpid, !draft.mats.some(function (m) { return m.pid === rpid; }));
      return;
    }
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var d = draft, a = b.getAttribute('data-act'), i = +b.getAttribute('data-i');
    if (a === 'inc') d.items[i].q += 1;
    else if (a === 'dec') { if (d.items[i].q > 1) d.items[i].q -= 1; }
    else if (a === 'rm') d.items.splice(i, 1);
    else if (a === 'kit') { openKit(byId(d.items[i].pid), i); return; }
    else if (a === 'mtoggle') { matOpen = !matOpen; renderMats(); if (matOpen) $('ed-mat-q').focus(); return; }
    else if (a === 'minc') { d.mats[i].q += 1; matsChanged(); return; }
    else if (a === 'mdec') { if (d.mats[i].q > 1) d.mats[i].q -= 1; matsChanged(); return; }
    markDirty(); renderLines();
  }
  function onLinesChange(e) {
    var d = draft, t = e.target;
    if (t.hasAttribute('data-mat')) {
      setMat(+t.getAttribute('data-mat'), t.checked);
    } else if (t.hasAttribute('data-price')) {
      var v = moneyVal(t);
      if (!(v > 0)) { snack('O preço precisa ser maior que zero.'); }
      else { d.items[+t.getAttribute('data-price')].pr = v; markDirty(); }
      renderLines();
    }
  }
  function recalcPrices() {
    var d = draft, miss = d.items.filter(function (it) { return byId(it.pid).price[d.ch] === undefined; });
    if (miss.length) { snack('Recalcular recusado: ' + byId(miss[0].pid).name + ' não tem preço no canal ' + d.ch + '.'); return; }
    d.items.forEach(function (it) { it.pr = byId(it.pid).price[d.ch]; });
    markDirty(); renderLines();
    snack('Preços copiados da tabela do canal ' + d.ch + '.');
  }

  /* Cadastro rápido de cliente e de produto, em popup sobre a tela da venda */
  /* Campo digitável do cliente: a lista filtra por qualquer parte do nome */
  function setCustomer(name) {
    draft.cust = name; $('ed-cust').value = name;
    $('ed-cust-field').classList.remove('error'); $('ed-cust-err').textContent = '';
    markDirty();
  }
  function bindCustomerCombo() {
    var inp = $('ed-cust'), box = $('ed-cust-list'), hi = 0, shown = [], open = false;
    function render() {
      var q = inp.value.trim();
      shown = customers.filter(function (c) { return !q || norm(c).indexOf(norm(q)) > -1; });
      if (hi >= shown.length) hi = Math.max(0, shown.length - 1);
      box.innerHTML = shown.length ? shown.map(function (c, i) {
        return '<li role="option" class="' + (i === hi ? 'hi' : '') + '" data-c="' + i + '" aria-selected="' + (i === hi) + '">' + hl(esc(c), esc(q)) + '</li>';
      }).join('') : '<li class="empty">Nenhum cliente encontrado.' + (q ? '<br><button class="btn outlined small" type="button" data-newc="1">Cadastrar cliente "' + esc(q) + '"</button>' : '') + '</li>';
    }
    function show() { open = true; box.classList.remove('hidden'); inp.setAttribute('aria-expanded', 'true'); render(); }
    function hide() { open = false; box.classList.add('hidden'); inp.setAttribute('aria-expanded', 'false'); }
    function pick(c) { setCustomer(c); hide(); }
    inp.addEventListener('focus', function () { inp.select(); show(); });
    inp.addEventListener('input', function () { hi = 0; show(); if (!inp.value.trim() && draft.cust) { draft.cust = ''; markDirty(); } });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); if (!open) show(); hi = Math.min(hi + 1, shown.length - 1); render(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); hi = Math.max(hi - 1, 0); render(); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        if (shown[hi]) pick(shown[hi]);
        else if (inp.value.trim()) openNewCustomer(inp.value.trim());
      } else if (e.key === 'Escape' && open) { e.stopPropagation(); hide(); inp.value = draft.cust; }
    });
    box.addEventListener('mousedown', function (e) { e.preventDefault(); });
    box.addEventListener('click', function (e) {
      if (e.target.closest('[data-newc]')) { var t = inp.value.trim(); hide(); openNewCustomer(t); return; }
      var li = e.target.closest('[data-c]');
      if (li) pick(shown[+li.getAttribute('data-c')]);
    });
    inp.addEventListener('blur', function () { hide(); inp.value = draft.cust; });
  }
  function openNewCustomer(text) {
    dialog('Novo cliente',
      '<div class="field" id="nc-f"><label for="nc-name">Nome</label><input id="nc-name" autocomplete="off" value="' + esc(text || '') + '"><span class="err" id="nc-err"></span></div>' +
      '<div class="check-row"><label class="check"><input type="checkbox" id="nc-cust" checked> Cliente</label>' +
      '<label class="check"><input type="checkbox" id="nc-sup"> Fornecedor</label></div>',
      [{ label: 'Cancelar', cls: 'outlined' }, { label: 'Salvar cliente', fn: saveCustomer }]);
    lastFocus = $('ed-newcust');
    $('nc-name').focus();
  }
  function saveCustomer() {
    var name = $('nc-name').value.trim(), isCust = $('nc-cust').checked, isSup = $('nc-sup').checked, err = '';
    if (!name) err = 'Informe o nome.';
    else if (!isCust && !isSup) err = 'Marque ao menos um papel.';
    else if (isSup && lists.people.rows.some(function (r) { return r.sup === 'Sim' && norm(r.name) === norm(name); })) err = 'Já existe um fornecedor com este nome.';
    $('nc-f').classList.toggle('error', !!err); $('nc-err').textContent = err;
    if (err) { $('nc-name').focus(); return false; }
    lists.people.rows.push({ name: name, cust: isCust ? 'Sim' : 'Não', sup: isSup ? 'Sim' : 'Não', role: isCust && isSup ? 'Cliente e fornecedor' : (isCust ? 'Cliente' : 'Fornecedor') });
    if (isCust) {
      customers.push(name); customers.sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); });
      setCustomer(name);
      snack('Cliente cadastrado e selecionado: ' + name + '.');
    } else snack('Fornecedor cadastrado: ' + name + '.');
  }

  function openNewProduct(text, list) {
    var ch = draft.ch;
    dialog('Novo produto',
      '<div class="dlg-form">' +
      '<div class="field full" id="np-nf"><label for="np-name">Nome</label><input id="np-name" autocomplete="off" value="' + esc(text || '') + '"><span class="err" id="np-nerr"></span></div>' +
      '<div class="field"><label for="np-type">Tipo</label><select id="np-type"><option>Mercadoria</option><option>Material</option></select></div>' +
      '<div class="field"><label>&nbsp;</label><label class="check"><input type="checkbox" id="np-comp"> Produto composto (kit)</label></div>' +
      '<div class="field"><label for="np-cat">Categoria</label><select id="np-cat"><option value="">Sem categoria</option>' + optionsHtml(categories) + '</select></div>' +
      '<div class="field"><label for="np-unit">Unidade-base</label><select id="np-unit">' + optionsHtml(units) + '</select></div>' +
      '<div class="sect" id="np-psect">Preço no canal ' + esc(ch) + '</div>' +
      '<div class="field full" id="np-pf"><label for="np-price">Preço de venda (R$)</label><input id="np-price" type="text" data-money inputmode="numeric" autocomplete="off" placeholder="0,00"><span class="err" id="np-perr"></span></div>' +
      '<div class="sect" id="np-ssect">Saldo inicial</div>' +
      '<div class="field" id="np-qf"><label for="np-qty">Quantidade</label><input id="np-qty" type="number" min="1" step="1"><span class="err" id="np-qerr"></span></div>' +
      '<div class="field" id="np-cf"><label for="np-cost">Custo unitário (R$)</label><input id="np-cost" type="text" data-money inputmode="numeric" autocomplete="off" placeholder="0,00"><span class="err" id="np-cerr"></span></div>' +
      '<p class="muted full" id="np-note">O saldo inicial vira um ajuste de entrada com o motivo "Saldo inicial". Os preços dos outros canais ficam no módulo Preços.</p></div>',
      [{ label: 'Cancelar', cls: 'outlined' }, { label: 'Salvar produto', fn: function () { return saveProduct(list); } }]);
    function sync() {
      var mat = $('np-type').value === 'Material';
      if (mat) $('np-comp').checked = false;
      $('np-comp').disabled = mat;
      var comp = $('np-comp').checked;
      ['np-psect', 'np-pf'].forEach(function (id) { $(id).classList.toggle('hidden', mat); });
      ['np-ssect', 'np-qf', 'np-cf', 'np-note'].forEach(function (id) { $(id).classList.toggle('hidden', comp); });
    }
    $('np-type').addEventListener('change', sync);
    $('np-comp').addEventListener('change', sync);
    sync();
    var nm = $('np-name'); nm.focus(); nm.setSelectionRange(nm.value.length, nm.value.length);
  }
  function saveProduct(list) {
    var name = $('np-name').value.trim(), mat = $('np-type').value === 'Material', comp = $('np-comp').checked;
    var price = moneyVal($('np-price')), qty = parseInt($('np-qty').value, 10), cost = moneyVal($('np-cost'));
    var errs = {
      nf: name ? '' : 'Informe o nome.',
      pf: (!mat && !(price > 0)) ? 'O preço precisa ser maior que zero.' : '',
      qf: (!comp && !(qty > 0)) ? 'Informe a quantidade.' : '',
      cf: (!comp && !(cost >= 0)) ? 'Informe o custo.' : ''
    };
    var bad = false;
    Object.keys(errs).forEach(function (k) {
      $('np-' + k).classList.toggle('error', !!errs[k]);
      $('np-' + k.charAt(0) + 'err').textContent = errs[k];
      if (errs[k]) bad = true;
    });
    if (bad) return false;
    var p = { id: nextProd++, name: name, kind: mat ? 'material' : (comp ? 'kit' : 'item'), unit: $('np-unit').value };

    if (!comp) {
      lists['stock-adjustments'].rows.unshift({ date: TODAY, name: name, dir: 'Entrada', q: String(qty), why: 'Saldo inicial' });
      lists['stock-movements'].rows.unshift({ date: TODAY, name: name, type: 'Entrada por ajuste', dir: 'Entrada', q: String(qty) });
      lists['stock-batches'].rows.unshift({ id: '#' + (nextBatch++), name: name, entry: TODAY, init: String(qty), bal: String(qty), cost: money(cost), fr: 'R$ 0,00' });
    }
    list.refresh();
    if (mat) { draft.mats.push({ pid: p.id, q: 1 }); markDirty(); renderLines(); snack('Material cadastrado e incluído no pedido: ' + name + '.'); }
    else if (comp) { snack('Kit cadastrado. Monte os componentes.'); setTimeout(function () { openKit(p, null); }, 0); }
    else { addItem(p); snack('Produto cadastrado e incluído no pedido: ' + name + '.'); }

  /* Montagem do kit */
  function openKit(kit, idx) {
    var comps = idx === null ? [] : clone(draft.items[idx].comps), swap = null;
    openModal('<div class="modal-head"><h2>Montar o kit: ' + kit.name + '</h2></div>' +
      '<div class="modal-body split-kit"><div>' + plistHtml('kb', ['item']) + '</div>' +
      '<div><div class="alert hidden" id="kb-swap"></div><div id="kb-comps"></div><div class="kit-sum" id="kb-sum"></div></div></div>' +
      '<div class="modal-foot"><span class="foot-note" id="kb-count"></span><button class="btn outlined" type="button" id="kb-cancel">Cancelar</button><button class="btn" type="button" id="kb-ok">Concluir kit</button></div>', true);
    function renderComps() {
      var total = 0, h = '';
      if (!comps.length) h = '<div class="empty">Clique em um produto da lista para adicionar o primeiro componente.</div>';
      comps.forEach(function (c, i) {
        var p = byId(c.pid); total += c.q;
        h += '<div class="line' + (swap === i ? ' swapping' : '') + '"><div class="line-main"><span class="line-name">' + p.name + '</span><span class="muted">' + p.cat + ' · ' + money(p.price[draft.ch] || 0) + '</span></div>' +
          '<div class="line-ctl"><div class="qty"><button type="button" data-k="dec" data-i="' + i + '" aria-label="Diminuir a quantidade de ' + p.name + '">−</button><span>' + c.q + '</span>' +
          '<button type="button" data-k="inc" data-i="' + i + '" aria-label="Aumentar a quantidade de ' + p.name + '">+</button></div>' +
          '<button class="btn outlined small" type="button" data-k="swap" data-i="' + i + '">Trocar</button>' +
          '<button class="x" type="button" data-k="rm" data-i="' + i + '" aria-label="Remover ' + p.name + '" style="margin-left:auto">×</button></div></div>';
      });
      $('kb-comps').innerHTML = h;
      $('kb-count').textContent = total + (total === 1 ? ' componente' : ' componentes');
      var cost = 0, ref = 0, salePrice = idx === null ? kit.price[draft.ch] : draft.items[idx].pr;
      comps.forEach(function (c) { var p = byId(c.pid); cost += c.q * p.cost; ref += c.q * (p.price[draft.ch] || 0); });
      var over = ref > salePrice + 0.005;
      $('kb-sum').innerHTML = (over ? '<div class="alert warn" role="alert">A soma dos preços avulsos ultrapassa o preço do kit em ' + money(ref - salePrice) + '.</div>' : '') +
        '<div' + (over ? ' class="over"' : '') + '><span class="' + (over ? '' : 'k') + '">Soma dos preços avulsos (referência)</span><span>' + money(ref) + '</span></div>' +
        '<div><span class="k">Custo dos componentes</span><span>' + money(cost) + '</span></div>' +
        '<div class="kit-main"><span>Preço de venda do kit (' + esc(draft.ch) + ')</span><span>' + money(salePrice) + '</span></div>';
      var box = $('kb-swap');
      if (swap === null) { box.classList.add('hidden'); box.innerHTML = ''; }
      else {
        box.classList.remove('hidden');
        box.innerHTML = 'Escolha na lista o item que entra no lugar de <strong>' + byId(comps[swap].pid).name + '</strong>. <button class="link" type="button" id="kb-swap-x">Cancelar a troca</button>';
        $('kb-swap-x').addEventListener('click', function () { swap = null; renderComps(); $('kb-q').focus(); });
      }
    }
    plistBind('kb', function () { return draft.ch; }, ['item'], false, function (p) {
      if (swap !== null) {
        var dup = -1;
        comps.forEach(function (c, j) { if (c.pid === p.id && j !== swap) dup = j; });
        if (dup > -1) { comps[dup].q += comps[swap].q; comps.splice(swap, 1); } else { comps[swap].pid = p.id; }
        swap = null;
      } else {
        var found = null;
        comps.forEach(function (c) { if (c.pid === p.id) found = c; });
        if (found) found.q += 1; else comps.push({ pid: p.id, q: 1 });
      }
      renderComps();
    });
    $('kb-comps').addEventListener('click', function (e) {
      var b = e.target.closest('[data-k]');
      if (!b) return;
      var a = b.getAttribute('data-k'), i = +b.getAttribute('data-i');
      if (a === 'inc') comps[i].q += 1;
      else if (a === 'dec') { if (comps[i].q > 1) comps[i].q -= 1; }
      else if (a === 'rm') { comps.splice(i, 1); swap = null; }
      else if (a === 'swap') { swap = i; renderComps(); $('kb-q').focus(); return; }
      renderComps();
    });
    $('kb-cancel').addEventListener('click', function () { closeModal(); });
    $('kb-ok').addEventListener('click', function () {
      if (!comps.length) { snack('Adicione pelo menos um componente ao kit.'); return; }
      if (idx === null) draft.items.push({ pid: kit.id, q: 1, pr: kit.price[draft.ch], comps: comps });
      else draft.items[idx].comps = comps;
      markDirty(); closeModal(); renderLines();
    });
    renderComps();
    $('kb-q').focus();
  }

  /* Ações do rascunho */
  function saveNew() {
    var d = draft;
    d.id = nextId++; d.dirty = false;
    sales.unshift(stripDraft(d));
    snack('Rascunho #' + d.id + ' criado.');
    go('sale-' + d.id);
  }
  function stripDraft(d) { var r = clone(d); delete r.dirty; return r; }
  function saveExisting() {
    var d = draft;
    for (var i = 0; i < sales.length; i++) if (sales[i].id === d.id) sales[i] = stripDraft(d);
    d.dirty = false; updateDirty();
    snack('Rascunho #' + d.id + ' salvo.');
  }
  function complete() {
    var d = draft;
    if (!d.items.length) { snack('Adicione pelo menos um item para efetivar.'); return; }
    if (!d.cust) {
      $('ed-cust-field').classList.add('error'); $('ed-cust-err').textContent = 'Informe o cliente para efetivar.';
      $('ed-cust').focus(); snack('Informe o cliente para efetivar.'); return;
    }
    var dt = parseDate(d.date), today = parseDate(TODAY);
    if (!dt || dt > today) { snack('Informe uma data válida, que não seja futura.'); return; }
    var short = stockShortage(d);
    if (short.length) {
      dialog('Estoque insuficiente',
        '<p>A venda continua em rascunho. Reduza as quantidades ou troque os itens.</p>' +
        '<div class="table-wrap"><table><thead><tr><th>Produto</th><th class="num">Necessário</th><th class="num">Saldo</th></tr></thead><tbody>' +
        short.map(function (s) { return '<tr><td>' + s.name + '</td><td class="num">' + s.need + '</td><td class="num">' + s.bal + '</td></tr>'; }).join('') + '</tbody></table></div>',
        [{ label: 'Fechar' }]);
      return;
    }
    applyStock(d, -1, true);
    if (!d.id) d.id = nextId++;
    d.status = 'Efetivada';
    var rec = stripDraft(d), found = false;
    for (var i = 0; i < sales.length; i++) if (sales[i].id === rec.id) { sales[i] = rec; found = true; }
    if (!found) sales.unshift(rec);
    draft = null;
    snack('Venda #' + rec.id + ' efetivada. Estoque baixado.');
    go('sale-' + rec.id);
  }
  function confirmDelete() {
    var id = draft.id;
    dialog('Excluir o rascunho #' + id + '?', '<p>O rascunho e os itens são removidos.</p>', [
      { label: 'Cancelar', cls: 'outlined' },
      { label: 'Excluir', cls: 'danger', fn: function () {
        sales = sales.filter(function (s) { return s.id !== id; });
        draft = null; snack('Rascunho #' + id + ' excluído.'); go('sales');
      } }
    ]);
  }

  /* Detalhe da venda */
  function viewSaleDetail(id) {
    var s = null;
    sales.forEach(function (x) { if (String(x.id) === id) s = x; });
    if (!s) { go('sales'); return; }
    if (s.status === 'Rascunho') {
      if (!draft || draft.id !== s.id) { draft = clone(s); draft.dirty = false; }
      renderEditor();
      return;
    }
    draft = null;
    renderReadOnly(s);
  }
  function renderReadOnly(s) {

    var html = '<div class="page-head"><a class="btn outlined" href="#sales" id="rd-back">← Voltar para as vendas</a><h1>Venda #' + s.id + '</h1>' + chip(s.status) + '<span class="spacer"></span>' +
      (s.status === 'Efetivada' ? '<button class="btn outlined" type="button" id="rd-return">Devolver venda</button>' : '') + '</div>';
    if (s.status === 'Devolvida') html += '<div class="alert">Venda devolvida em ' + s.ret + '. A compra de devolução voltou ao estoque os itens e os componentes dos kits.</div>';
    html += '<div class="card pad"><div class="kv">' +
      '<div><div class="k">Cliente</div><div class="v">' + s.cust + '</div></div>' +
      '<div><div class="k">Canal</div><div class="v">' + s.ch + '</div></div>' +
      '<div><div class="k">Data</div><div class="v">' + s.date + '</div></div>' +
      '<div><div class="k">Frete cobrado do cliente</div><div class="v">' + money(s.freight) + '</div></div></div></div>';
    html += '<div class="grid cols-2"><div class="card"><div class="table-wrap"><table><thead><tr><th>Produto</th><th class="num">Qtd.</th><th class="num">Preço</th><th class="num">Subtotal</th></tr></thead><tbody>' +
      s.items.map(function (it) {
        var p = byId(it.pid);
        return '<tr><td>' + p.name + '</td><td class="num">' + it.q + '</td><td class="num">' + money(it.pr) + '</td><td class="num">' + money(it.q * it.pr) + '</td></tr>' +

      }).join('') + '</tbody></table></div>' +
      '<div class="pad"><strong>Materiais:</strong> ' + (s.mats.length ? s.mats.map(function (m) { return byId(m.pid).name + ' × ' + m.q; }).join(', ') : 'nenhum') + '</div></div>' +
      '<div class="card pad"><h2>Totais</h2><div class="summary">' +
      '<div class="row"><span>Valor da venda</span><span>' + money(t.value) + '</span></div>' +
      '<div class="row"><span>Custo dos itens</span><span>' + money(t.cost) + '</span></div>' +
      '<div class="row"><span>Taxas do canal</span><span>' + money(t.fees) + '</span></div>' +
      '<div class="row total"><span>Resultado parcial</span><span>' + money(t.value - t.cost - t.fees) + '</span></div>' +
      '<div class="hint">O rateio das despesas entra no fechamento do mês.</div></div></div></div>';

  function openReturn(s) {
    dialog('Devolver a venda #' + s.id,
      '<p>A devolução é total. Os itens e os componentes dos kits voltam ao estoque. Os materiais não voltam.</p>' +
      '<div class="field" id="rt-field"><label for="rt-date">Data da devolução</label><input id="rt-date" value="' + TODAY + '"><span class="err" id="rt-err"></span></div>',
      [{ label: 'Cancelar', cls: 'outlined' },
       { label: 'Devolver venda', fn: function () {
         var r = parseDate($('rt-date').value), sd = parseDate(s.date), today = parseDate(TODAY);
         if (!r || r < sd || r > today) {
           $('rt-field').classList.add('error');
           $('rt-err').textContent = 'Use uma data entre a data da venda (' + s.date + ') e hoje.';
           return false;
         }
         applyStock(s, 1, false);
         s.status = 'Devolvida'; s.ret = $('rt-date').value.trim();
         snack('Venda #' + s.id + ' devolvida. Itens de volta ao estoque.');
         setTimeout(route, 0);
       } }]);

  /* ---------- Usuários ---------- */
  function userById(id) { for (var i = 0; i < users.length; i++) if (String(users[i].id) === String(id)) return users[i]; return null; }
  /* O login é único sem diferenciar maiúsculas de minúsculas (citext) */
  function loginTaken(login, exceptId) {
    return users.some(function (u) { return u.id !== exceptId && u.login.toLowerCase() === login.toLowerCase(); });
  }
  function setFieldError(fieldId, errId, msg) { $(fieldId).classList.toggle('error', !!msg); $(errId).textContent = msg; }
  function userFieldsHtml(p, u) {
    return '<div class="field" id="' + p + '-nf"><label for="' + p + '-name">Nome</label><input id="' + p + '-name" autocomplete="off" value="' + esc(u ? u.name : '') + '"><span class="err" id="' + p + '-nerr"></span></div>' +
      '<div class="field" id="' + p + '-lf"><label for="' + p + '-login">Login</label><input id="' + p + '-login" autocomplete="off" value="' + esc(u ? u.login : '') + '"><span class="err" id="' + p + '-lerr"></span></div>';
  }
  function checkNameLogin(p, exceptId) {
    var name = $(p + '-name').value.trim(), login = $(p + '-login').value.trim();
    var ne = name ? '' : 'Informe o nome.';
    var le = !login ? 'Informe o login.' : (loginTaken(login, exceptId) ? 'Esse login já existe.' : '');
    setFieldError(p + '-nf', p + '-nerr', ne);
    setFieldError(p + '-lf', p + '-lerr', le);
    if (ne) { $(p + '-name').focus(); return false; }
    if (le) { $(p + '-login').focus(); return false; }
    return true;
  }
  function renderUser() {
    var me = $('me');
    me.setAttribute('href', '#user-' + currentUser.id);
    me.querySelector('.avatar').textContent = currentUser.name.charAt(0).toUpperCase();
    me.querySelector('.name').textContent = currentUser.name;
  }

  function viewNewUser() {
    $('view').innerHTML = '<div class="page-head"><a class="btn outlined" href="#users">← Voltar para os usuários</a><h1>Novo usuário</h1></div>' +
      '<form class="card pad user-form" id="nu-form" novalidate><div class="form-grid">' + userFieldsHtml('nu', null) +
      '<div class="field" id="nu-pf"><label for="nu-pass">Senha</label><input id="nu-pass" type="password" autocomplete="new-password"><span class="err" id="nu-perr"></span></div>' +
      '<div class="field" id="nu-cf"><label for="nu-conf">Confirmar a senha</label><input id="nu-conf" type="password" autocomplete="new-password"><span class="err" id="nu-cerr"></span></div></div>' +
      '<p class="muted" style="margin:0">A senha tem no mínimo 8 caracteres.</p>' +
      '<div class="actions"><a class="btn outlined" href="#users">Cancelar</a><button class="btn" type="submit">Criar usuário</button></div></form>';
    $('nu-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var okName = checkNameLogin('nu');
      var pass = $('nu-pass').value, conf = $('nu-conf').value;
      var pe = pass.length >= 8 ? '' : 'A senha precisa de no mínimo 8 caracteres.';
      var ce = !pe && pass !== conf ? 'As senhas não coincidem.' : '';
      setFieldError('nu-pf', 'nu-perr', pe);
      setFieldError('nu-cf', 'nu-cerr', ce);
      if (!okName) return;
      if (pe) { $('nu-pass').focus(); return; }
      if (ce) { $('nu-conf').focus(); return; }
      var u = { id: nextUser++, name: $('nu-name').value.trim(), login: $('nu-login').value.trim(), active: true, pass: pass };
      users.push(u);
      snack('Usuário criado: ' + u.name + '.');
      go('users');
    });
    $('nu-name').focus();
  }

  function viewUserDetail(id) {
    var u = userById(id);
    if (!u) { go('users'); return; }
    var self = u.id === currentUser.id;
    var lock = self ? 'Você não pode desativar nem excluir o seu próprio usuário.' : '';
    var html = '<div class="page-head"><a class="btn outlined" href="#users">← Voltar para os usuários</a><h1>' + esc(u.name) + '</h1>' + chip(u.active ? 'Ativo' : 'Inativo') + '<span class="spacer"></span>' +
      (self ? '<button class="btn outlined" type="button" id="ud-pass">Trocar senha</button>' : '') +
      '<button class="btn outlined" type="button" id="ud-toggle"' + (u.active && lock ? ' disabled' : '') + '>' + (u.active ? 'Desativar' : 'Ativar') + '</button>' +
      '<button class="btn danger" type="button" id="ud-del"' + (lock ? ' disabled' : '') + '>Excluir</button></div>';
    if (lock) html += '<div class="alert">' + lock + '</div>';
    html += '<form class="card pad user-form" id="ud-form" novalidate><h2>Dados do usuário</h2><div class="form-grid">' + userFieldsHtml('ud', u) + '</div>' +
      '<div class="actions"><button class="btn" type="submit">Salvar</button></div></form>';
    $('view').innerHTML = html;
    $('ud-form').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!checkNameLogin('ud', u.id)) return;

      snack('Usuário salvo.');
      route();
    });
    $('ud-toggle').addEventListener('click', function () {
      u.active = !u.active;
      snack(u.active ? 'Usuário ativado.' : 'Usuário desativado.');
      route();
    });
    if ($('ud-pass')) $('ud-pass').addEventListener('click', function () { openPassword(u); });
    $('ud-del').addEventListener('click', function () { confirmDeleteUser(u); });
