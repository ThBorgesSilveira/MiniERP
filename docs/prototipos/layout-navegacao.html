  function openPassword(u) {
    dialog('Trocar a senha',
      '<div class="field" id="pw-af"><label for="pw-cur">Senha atual</label><input id="pw-cur" type="password" autocomplete="current-password"><span class="err" id="pw-aerr"></span></div>' +
      '<div class="field" id="pw-nf"><label for="pw-new">Nova senha</label><input id="pw-new" type="password" autocomplete="new-password"><span class="err" id="pw-nerr"></span></div>' +
      '<div class="field" id="pw-cf"><label for="pw-conf">Confirmar a nova senha</label><input id="pw-conf" type="password" autocomplete="new-password"><span class="err" id="pw-cerr"></span></div>',
      [{ label: 'Cancelar', cls: 'outlined' },
       { label: 'Trocar senha', fn: function () {
         var cur = $('pw-cur').value, nw = $('pw-new').value, cf = $('pw-conf').value;
         var ae = cur === u.pass ? '' : 'A senha atual está incorreta.';
         var ne = nw.length >= 8 ? '' : 'A nova senha precisa de no mínimo 8 caracteres.';
         var ce = !ne && nw !== cf ? 'As senhas não coincidem.' : '';
         setFieldError('pw-af', 'pw-aerr', ae);
         setFieldError('pw-nf', 'pw-nerr', ne);
         setFieldError('pw-cf', 'pw-cerr', ce);
         if (ae || ne || ce) { $(ae ? 'pw-cur' : (ne ? 'pw-new' : 'pw-conf')).focus(); return false; }
         u.pass = nw;
         snack('Senha alterada.');
       } }]);
    $('pw-cur').focus();
  }

  function confirmDeleteUser(u) {
    dialog('Excluir o usuário ' + esc(u.name) + '?', '<p>O usuário deixa de entrar no sistema.</p>', [
      { label: 'Cancelar', cls: 'outlined' },
      { label: 'Excluir', cls: 'danger', fn: function () {
        users = users.filter(function (x) { return x.id !== u.id; });
        snack('Usuário excluído.'); go('users');
      } }
    ]);
  }

  /* ---------- Auditoria ---------- */
  function auditBy(f) { return auditLog.filter(f).sort(function (x, y) { return y.id - x.id; }); }
  function auditHead(title, backHref, backLabel, extra) {
    return '<div class="page-head">' + (backHref ? '<a class="btn outlined" href="' + backHref + '">← ' + backLabel + '</a>' : '') + '<h1>' + title + '</h1>' + (extra || '') + '</div>';
  }
  function auditTable(head, rows, cols) {
    return '<div class="card"><div class="table-wrap"><table><thead><tr>' + head + '</tr></thead><tbody>' +
      (rows.length ? rows.join('') : '<tr><td colspan="' + cols + '"><div class="empty">Nenhum registro encontrado.</div></td></tr>') + '</tbody></table></div></div>';
  }
  function viewAudit() {
    var tables = [];
    auditLog.forEach(function (e) { if (tables.indexOf(e.table) < 0) tables.push(e.table); });
    var rows = tables.map(function (t) {
      return '<tr class="clickable" tabindex="0" data-href="#audit-t-' + t + '"><td>' + esc(tableLabel(t)) + '</td></tr>';
    });
    $('view').innerHTML = auditHead('Auditoria') + auditTable('<th>Tabela</th>', rows, 1);
  }
  function viewAuditRecords(t) {
    var recs = [];
    auditLog.forEach(function (e) { if (e.table === t && recs.indexOf(e.rec) < 0) recs.push(e.rec); });
    if (!recs.length) { go('audit'); return; }
    recs.sort(function (x, y) { return x - y; });
    var rows = recs.map(function (r) {
      return '<tr class="clickable" tabindex="0" data-href="#audit-r-' + t + '-' + r + '"><td class="num">' + r + '</td></tr>';
    });
    $('view').innerHTML = auditHead(esc(tableLabel(t)), '#audit', 'Voltar para as tabelas') +
      auditTable('<th class="num">Registro</th>', rows, 1);
  }
  function viewAuditChanges(t, r) {
    var l = auditBy(function (e) { return e.table === t && String(e.rec) === r; });
    if (!l.length) { go('audit-t-' + t); return; }
    var rows = l.map(function (e) {
      return '<tr class="clickable" tabindex="0" data-href="#audit-' + e.id + '"><td>' + e.date + '</td><td>' + chip(actionLabel[e.action]) + '</td><td>' + esc(e.user) + '</td></tr>';
    });
    $('view').innerHTML = auditHead('Registro ' + r, '#audit-t-' + t, 'Voltar para os registros', '<span class="sub-title">' + esc(tableLabel(t)) + '</span>') +
      auditTable('<th>Data</th><th>Ação</th><th>Usuário</th>', rows, 3);
  }
  function viewAuditDetail(id) {
    var e = null;
    auditLog.forEach(function (x) { if (String(x.id) === id) e = x; });
    if (!e) { go('audit'); return; }
    var html = auditHead('Alteração de ' + e.date, '#audit-r-' + e.table + '-' + e.rec, 'Voltar para as alterações', chip(actionLabel[e.action])) +
      '<div class="card pad"><div class="kv">' +
      '<div><div class="k">Tabela</div><div class="v">' + esc(tableLabel(e.table)) + '</div></div>' +
      '<div><div class="k">Registro</div><div class="v">' + e.rec + '</div></div>' +
      '<div><div class="k">Ação</div><div class="v">' + actionLabel[e.action] + '</div></div>' +
      '<div><div class="k">Data</div><div class="v">' + e.date + '</div></div>' +
      '<div><div class="k">Usuário</div><div class="v">' + esc(e.user) + '</div></div></div></div>' +
      '<div class="card"><div class="pad" style="padding-bottom:0"><h2>Versão anterior do registro</h2></div><div class="table-wrap"><table><thead><tr><th>Campo</th><th>Valor</th></tr></thead><tbody>' +
      Object.keys(e.data).map(function (k) {
        var v = e.data[k];
        return '<tr><td>' + esc(fieldLabel(e.table, k)) + '</td><td class="audit-val">' + esc(v === null ? '' : String(v)) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
    $('view').innerHTML = html;
  }

  /* ---------- Fechamento e DRE ---------- */
  function pendingMonths() { return months.filter(function (m) { return !m.closed; }); }

  function viewClosing() {
    var html = '<div class="page-head"><h1>Fechamento do mês</h1><span class="sub-title">O fechamento calcula a % real e grava o rateio das despesas em cada venda do mês.</span></div>' +
      '<div class="card"><div class="table-wrap"><table><thead><tr><th>Mês</th><th class="num">Vendas efetivadas</th><th class="num">Receita</th><th class="num">Despesas do mês</th><th class="num">% real</th><th>Situação</th><th></th></tr></thead><tbody>' +
      months.map(function (m) {
        return '<tr><td>' + m.label + '</td><td class="num">' + m.sales + '</td><td class="num">' + money(m.revenue) + '</td><td class="num">' + money(monthExpenses) + '</td>' +
          '<td class="num">' + (m.closed ? pct(monthExpenses / m.revenue * 100) : '—') + '</td><td>' + chip(m.closed ? 'Fechado' : 'Pendente') + '</td>' +
          '<td class="num"><button class="btn' + (m.closed ? ' outlined' : '') + ' small" type="button" data-close="' + m.key + '">' + (m.closed ? 'Refazer' : 'Fechar o mês') + '</button></td></tr>';
      }).join('') + '</tbody></table></div></div>';
    $('view').innerHTML = html;
    $('view').querySelectorAll('[data-close]').forEach(function (b) {
      b.addEventListener('click', function () {
        var m = months.filter(function (x) { return x.key === b.getAttribute('data-close'); })[0];
        var again = m.closed;
        m.closed = true;
        snack(m.label + (again ? ' refeito.' : ' fechado.') + ' Rateio gravado em ' + m.sales + ' vendas.');
        route();
      });
    });
  }

  function viewDre() {
    var rows = [
      { l: 'Receita', f: function (m) { return m.revenue; }, cls: '' },
      { l: '(−) Custo direto', f: function (m) { return -m.cost; }, cls: 'neg' },
      { l: 'Margem bruta', f: function (m) { return m.revenue - m.cost; }, cls: 'sub-total' },
      { l: '(−) Materiais da venda', f: function (m) { return -m.mat; }, cls: 'neg' },
      { l: '(−) Frete de compra', f: function (m) { return -m.freight; }, cls: 'neg' },
      { l: '(−) Taxas do canal', f: function (m) { return -m.fees; }, cls: 'neg' },
      { l: '(−) Perda de materiais em devoluções', f: function (m) { return -m.loss; }, cls: 'neg' },
      { l: '(−) Despesas rateadas', f: function (m) { return m.closed ? -monthExpenses : null; }, cls: 'neg' },
      { l: 'Resultado', f: function (m) { return m.revenue - m.cost - m.mat - m.freight - m.fees - m.loss - (m.closed ? monthExpenses : 0); }, cls: 'result' }
    ];
    var html = '<div class="page-head"><h1>Relatórios (DRE)</h1><span class="sub-title">Só vendas efetivadas. Vendas devolvidas ficam fora da receita e do custo dos itens.</span></div>' +
      '<div class="card"><div class="toolbar">' +
      '<div class="field"><label for="d-from">Período inicial</label><input id="d-from" value="01/08/2026"></div>' +
      '<div class="field"><label for="d-to">Período final</label><input id="d-to" value="31/10/2026"></div>' +
      '<div class="field"><label for="d-ch">Canal</label><select id="d-ch"><option>Todos</option>' + Object.keys(channels).map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="d-grp">Agrupar por</label><select id="d-grp"><option>Mês</option><option>Canal</option></select></div></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Linha</th>' + months.map(function (m) { return '<th class="num">' + m.label + (m.closed ? '' : ' <span class="flag">· pendente</span>') + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr class="' + (r.cls === 'neg' ? '' : r.cls) + '"><td>' + r.l + '</td>' + months.map(function (m) {
          var v = r.f(m);
          if (v === null) return '<td class="num flag">—</td>';
          var partial = r.l === 'Resultado' && !m.closed;
          return '<td class="num ' + (r.cls === 'neg' ? 'neg' : '') + '">' + money(v) + (partial ? ' <span class="flag">*</span>' : '') + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>' +
      (pendingMonths().length ? '<div class="pad flag">* Resultado parcial: o mês pendente ainda não tem despesas rateadas. Feche o mês para completar a linha.</div>' : '') + '</div>';
    $('view').innerHTML = html;
    $('d-grp').addEventListener('change', function () { snack('O agrupamento por canal troca as colunas de meses por canais.'); });
  }

  /* ---------- Navegação ---------- */
  /* Aparência: o tema vale para a instalação inteira */
  var themes = [
    { id: 'default', name: 'Padrão', desc: 'Azul, sem textura. Cantos discretos.' },
    { id: 'fofo', name: 'Fofo', desc: 'Rosa suave, cantos arredondados e textura de corações na barra superior.' }
  ];
  function viewAppearance() {
    var cur = document.documentElement.getAttribute('data-theme'), mode = document.documentElement.getAttribute('data-mode');
    $('view').innerHTML = '<div class="page-head"><h1>Aparência</h1></div>' +
      '<div class="card pad"><p class="muted" style="margin:0 0 16px">O tema vale para todos os usuários, inclusive na tela de login. Cada usuário escolhe o modo claro ou escuro no botão da barra superior.</p>' +
      '<div class="theme-grid" role="radiogroup" aria-label="Tema do sistema">' + themes.map(function (t) {
        return '<button type="button" class="theme-card" role="radio" aria-checked="' + (t.id === cur) + '" data-pick="' + t.id + '">' +
          '<div class="theme-prev" data-theme="' + t.id + '" data-mode="' + mode + '"><div class="pbar"></div><div class="pbody"><span class="pbtn">Salvar</span><span class="pout">Cancelar</span><span class="pchip">Efetivada</span></div></div>' +
          '<span class="tname">' + t.name + (t.id === cur ? ' ' + chip('Em uso') : '') + '</span><span class="tdesc">' + t.desc + '</span></button>';
      }).join('') + '</div></div>';
    $('view').querySelector('.theme-grid').addEventListener('click', function (e) {
      var b = e.target.closest('[data-pick]');
      if (!b || b.getAttribute('data-pick') === cur) return;
      applyLook(b.getAttribute('data-pick'), mode);
      snack('Tema ' + themes.filter(function (t) { return t.id === b.getAttribute('data-pick'); })[0].name + ' salvo para todos os usuários.');
    });
  }
  var views = {
    sales: viewSales, 'new-sale': viewNewSale, 'new-user': viewNewUser, closing: viewClosing, 'reports-dre': viewDre, appearance: viewAppearance
  };
  var extraLocate = { 'new-sale': { group: null, label: 'Vendas', child: 'Nova venda' } };

  function renderNotice() {
    var p = pendingMonths();
    var el = $('notice');
    if (!p.length) { el.classList.add('hidden'); return; }
    el.classList.remove('hidden');
    el.innerHTML = '<span><strong>' + p.length + (p.length === 1 ? ' mês pendente' : ' meses pendentes') + ' de fechamento:</strong> ' + p.map(function (m) { return m.label.toLowerCase(); }).join(' e ') + '.</span>' +
      '<a class="btn" href="#closing">Fechar o mês</a>';
  }

  function renderCrumbs(viewId, child) {
    var loc = locate(viewId) || extraLocate[viewId] || { group: null, label: '' };
    var parts = [];
    if (loc.group) parts.push('<span class="group-name">' + loc.group + '</span><span class="sep">/</span>');
    parts.push('<span class="page-name">' + loc.label + '</span>');
    var c = child || loc.child;
    if (c) parts.push('<span class="sep">/</span><span class="page-name">' + c + '</span>');
    $('crumbs').innerHTML = parts.join('');
  }

  /* Tema (do sistema) e modo (do usuário) */
  function applyLook(theme, mode) {
    var el = document.documentElement;
    el.setAttribute('data-theme', theme); el.setAttribute('data-mode', mode);
    try { localStorage.setItem('maestro-theme', theme); localStorage.setItem('maestro-mode', mode); } catch (e) { /* sem armazenamento */ }
    $('mode-btn').textContent = mode === 'dark' ? '☀ Claro' : '☾ Escuro';
    $('mode-btn').setAttribute('aria-label', mode === 'dark' ? 'Mudar para o modo claro' : 'Mudar para o modo escuro');
    if (location.hash === '#appearance' && views && views.appearance) views.appearance();
  }
  applyLook(document.documentElement.getAttribute('data-theme'), document.documentElement.getAttribute('data-mode'));
  $('mode-btn').addEventListener('click', function () { applyLook(document.documentElement.getAttribute('data-theme'), document.documentElement.getAttribute('data-mode') === 'dark' ? 'light' : 'dark'); });

  function route() {
    if (suppressRoute) { suppressRoute = false; return; }
    var h = (location.hash || '').replace('#', '') || 'sales';
    if (guardLeave(h)) return;
    var query = '', qi = h.indexOf('?');
    if (qi >= 0) { query = h.slice(qi + 1); h = h.slice(0, qi); }
    if (h === 'login') {
      $('app').classList.add('hidden'); $('login').classList.remove('hidden'); document.title = 'MAESTRO Layout e Navegação';
      $('login-err').textContent = ''; $('login-user').focus();
      return;
    }
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    closeDrawer();
    renderUser();

    var navId = h, child = null;
    if (h.indexOf('sale-') === 0) { navId = 'sales'; child = 'Venda #' + h.slice(5); viewSaleDetail(h.slice(5)); }
    else if (h === 'new-sale') { navId = 'sales'; views['new-sale'](); }
    else if (h === 'new-user') { navId = 'users'; child = 'Novo usuário'; views['new-user'](); }
    else if (h.indexOf('user-') === 0) { navId = 'users'; var uu = userById(h.slice(5)); child = uu ? uu.name : null; viewUserDetail(h.slice(5)); }
    else if (h === 'audit') { viewAudit(); }
    else if (h.indexOf('audit-t-') === 0) { navId = 'audit'; child = tableLabel(h.slice(8)); viewAuditRecords(h.slice(8)); }
    else if (h.indexOf('audit-r-') === 0) {
      navId = 'audit'; var ar = h.slice(8), ai = ar.lastIndexOf('-'); child = 'Registro ' + ar.slice(ai + 1); viewAuditChanges(ar.slice(0, ai), ar.slice(ai + 1));
    }
    else if (h.indexOf('audit-') === 0) { navId = 'audit'; child = 'Alteração'; viewAuditDetail(h.slice(6)); }
    else if (views[h]) { views[h](); }
    else if (lists[h]) { if (builders[h]) lists[h].rows = builders[h](); listView(h, lists[h]); }
    else { location.hash = 'sales'; return; }

    renderNav(navId);
    renderCrumbs(navId, child || (h === 'new-sale' ? 'Nova venda' : null));
    renderNotice();
    $('content').scrollTop = 0;
  }

  /* ---------- Eventos ---------- */
  function closeDrawer() { $('sidebar').classList.remove('open'); $('scrim').classList.remove('open'); }
  $('menu-btn').addEventListener('click', function () { $('sidebar').classList.add('open'); $('scrim').classList.add('open'); });
  $('scrim').addEventListener('click', closeDrawer);
  $('logout').addEventListener('click', function () { location.hash = 'login'; });
  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var lg = $('login-user').value.trim(), pw = $('login-pass').value, msg = '', found = null;
    if (!lg || !pw) msg = 'Informe o login e a senha.';
    else {
      users.forEach(function (u) { if (u.login.toLowerCase() === lg.toLowerCase()) found = u; });
      if (!found || !found.active || found.pass !== pw) msg = 'Login ou senha inválidos.';
    }
    $('login-err').textContent = msg;
    if (msg) { (lg ? $('login-pass') : $('login-user')).focus(); return; }
    currentUser = found;
    location.hash = 'sales';
  });
  ['login-user', 'login-pass'].forEach(function (id) { $(id).addEventListener('input', function () { $('login-err').textContent = ''; }); });
  $('nav').addEventListener('click', function (e) {
    var b = e.target.closest('[data-group]');
    if (!b) return;
    var g = b.getAttribute('data-group');
    openGroups[g] = !b.parentNode.classList.contains('open');
    b.parentNode.classList.toggle('open', openGroups[g]);
    b.setAttribute('aria-expanded', openGroups[g] ? 'true' : 'false');
  });
  $('view').addEventListener('click', function (e) {
    var tr = e.target.closest('tr[data-href]');
    if (tr) { location.hash = tr.getAttribute('data-href').replace('#', ''); return; }
    var b = e.target.closest('button[data-msg], button[data-href]');
    if (!b) return;
    var href = b.getAttribute('data-href');
    if (href) location.hash = href.replace('#', ''); else if (b.getAttribute('data-msg')) snack(b.getAttribute('data-msg'));
  });
  $('view').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var tr = e.target.closest('tr[data-href]');
    if (tr) location.hash = tr.getAttribute('data-href').replace('#', '');
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('modal-root').firstChild) closeModal(); });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
